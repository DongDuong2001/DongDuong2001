<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="05 protocol">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#0e0e0e"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#E8112D"/></pattern>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.j{font-family:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP","MS Gothic",sans-serif}
.blink{animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.gl{opacity:0;animation:gl 6s steps(1) infinite}
@keyframes gl{0%{opacity:0}91%{opacity:.85;transform:translateX(-5px)}92%{opacity:0}95%{opacity:.7;transform:translateX(6px)}96%{opacity:0}}
.fl{animation:fl 5s steps(1) infinite}
@keyframes fl{0%{opacity:1}60%{opacity:.25}61%{opacity:1}63%{opacity:.5}64%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style>
.sw{animation:sw 3.2s cubic-bezier(.6,0,.4,1) -3.5s infinite}
@keyframes sw{0%{transform:translateX(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateX(718px);opacity:0}}
.sc{animation:sc 2.4s linear -3.5s infinite}
@keyframes sc{from{transform:translateY(-4px)}to{transform:translateY(60px)}}
.d{animation-delay:-3.5s}
</style>
</defs>
