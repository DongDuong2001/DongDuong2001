<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Duong Phu Dong, founder of Three Bugs Studio">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
      .sans{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
      .cur{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>

  <!-- sheet with chamfered corners, like the studio's buttons -->
  <path d="M16 2H1184L1198 16V324L1184 338H16L2 324V16Z" fill="#0a0a0a" stroke="#2a2a2a"/>
  <rect x="24" y="24" width="1152" height="292" fill="url(#grid)"/>

  <!-- left: identity -->
  <text x="56" y="76" class="mono" font-size="14" fill="#FF6A00">P-00 / operator</text>
  <text x="52" y="160" class="sans" font-size="76" font-weight="700" fill="#f2f2f2" letter-spacing="-2">Duong Phu Dong</text>
  <rect x="58" y="176" width="12" height="4" fill="#FF6A00" class="cur"/>

  <!-- dimension line under the name -->
  <g stroke="#555" stroke-width="1">
    <path d="M56 200V214M684 200V214M56 207H684"/>
  </g>
  <text x="370" y="232" class="mono" font-size="11" fill="#777" text-anchor="middle">software engineer · founder</text>

  <text x="56" y="282" class="mono" font-size="13" fill="#bbb">Three Bugs Studio</text>
  <text x="56" y="302" class="mono" font-size="13" fill="#666">Ho Chi Minh City · VN</text>

  <!-- right: CAD drawing title block -->
  <g transform="translate(760 186)" class="mono" font-size="11">
    <rect width="400" height="120" fill="#0a0a0a" stroke="#3a3a3a"/>
    <path d="M0 40H400M0 80H400M200 40V120M300 80V120" stroke="#3a3a3a"/>
    <text x="12" y="16" fill="#666">title</text>
    <text x="12" y="32" fill="#f2f2f2" font-size="13">Profile / README</text>
    <text x="12" y="56" fill="#666">dwg no.</text>
    <text x="12" y="72" fill="#FF6A00">3B-000</text>
    <text x="212" y="56" fill="#666">material</text>
    <text x="212" y="72" fill="#f2f2f2">Rust · TS · Go</text>
    <text x="12" y="96" fill="#666">studio</text>
    <text x="12" y="112" fill="#f2f2f2">3bstudio.me</text>
    <text x="212" y="96" fill="#666">rev</text>
    <text x="212" y="112" fill="#f2f2f2">2026.11</text>
    <text x="312" y="96" fill="#666">scale</text>
    <text x="312" y="112" fill="#f2f2f2">1:1</text>
  </g>

  <!-- corner registration marks -->
  <g stroke="#FF6A00" stroke-width="2" fill="none">
    <path d="M1136 40H1160V64"/>
  </g>
</svg>
